name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install verified dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Public source privacy check
        run: python tools/release_check.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic UI smoke test
        run: python main.py --demo --smoke-test
      - name: Install audit tools in isolated environment
        run: |
          python -m venv .audit-venv
          .audit-venv/Scripts/python.exe -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known dependency vulnerabilities
        run: .audit-venv/Scripts/python.exe -m pip_audit -r requirements.lock --require-hashes
      - name: Static security analysis
        run: .audit-venv/Scripts/python.exe -m bandit -q -r camera_api.py main.py monitor_ui.py ble_setup.py connection_store.py diagnose.py gopro_controller.py i18n.py privacy.py quality_capture.py quality_review.py quick_connection.py video_stream.py wifi_connect.py tools/release_check.py
