name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install verified dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --require-hashes -r requirements.lock
      - name: Public source privacy check
        run: python tools/release_check.py
      - name: Regression tests
        run: .venv/Scripts/python.exe -m unittest discover -s tests -t . -v
      - name: Synthetic UI smoke test
        run: .venv/Scripts/python.exe -I -S launch.py --demo --smoke-test
      - name: Install audit tools in isolated environment
        run: |
          python -m venv .audit-venv
          .audit-venv/Scripts/python.exe -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known dependency vulnerabilities
        run: .audit-venv/Scripts/python.exe -m pip_audit -r requirements.lock --require-hashes
      - name: Static security analysis
        run: .audit-venv/Scripts/python.exe -m bandit -q -r src/gopro_monitor launch.py tools/release_check.py tools/diagnose.py
